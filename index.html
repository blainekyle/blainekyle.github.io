<head>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050507'/%3E%3Cpolygon points='32,10 46,30 18,30' fill='%23ffffff'/%3E%3Cpolygon points='32,54 46,34 18,34' fill='%23ffffff' opacity='0.55'/%3E%3C/svg%3E">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        #wallpaperCanvas {
            position: fixed;
            inset: 0;
            display: block;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Bottom Dock Stage — passes pointer events through everywhere except the capsule */
        .dock-stage {
            position: fixed;
            left: 0;
            right: 0;
            bottom: clamp(14px, 3vh, 30px);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
            pointer-events: none;
            padding: 0 12px;
        }

        /* Subtle Cryptic Hover Caption */
        .dock-caption {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(8, 8, 12, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
            font-size: 11px;
            line-height: 1;
            letter-spacing: 0.14em;
            color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.2s ease;
            pointer-events: none;
            white-space: nowrap;
            max-width: 94vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dock-caption.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .dock-caption .cap-sigil {
            color: var(--cap-accent, #ffffff);
            font-size: 12px;
            text-shadow: 0 0 10px var(--cap-accent, rgba(255, 255, 255, 0.6));
        }

        .dock-caption .cap-title {
            font-weight: 600;
            color: #ffffff;
        }

        .dock-caption .cap-sep {
            color: rgba(255, 255, 255, 0.28);
            letter-spacing: 0;
        }

        .dock-caption .cap-desc {
            color: rgba(255, 255, 255, 0.58);
            letter-spacing: 0.08em;
            text-transform: lowercase;
        }

        .dock-caption .cap-tag {
            font-size: 9px;
            letter-spacing: 0.12em;
            padding: 2px 5px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.07);
            color: var(--cap-accent, rgba(255, 255, 255, 0.7));
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Floating Obsidian Dock Capsule */
        .dock {
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            gap: clamp(10px, 2.4vw, 28px);
            padding: clamp(10px, 1.5vh, 14px) clamp(16px, 2.8vw, 30px);
            background: rgba(7, 7, 10, 0.62);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8),
                        inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: border-color 0.25s ease, background-color 0.25s ease;
        }

        .dock:hover {
            border-color: rgba(255, 255, 255, 0.17);
            background: rgba(9, 9, 14, 0.74);
        }

        .dock-link {
            --accent: #ffffff;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: clamp(36px, 5.2vw, 52px);
            height: clamp(36px, 5.2vw, 52px);
            color: rgba(255, 255, 255, 0.78);
            text-decoration: none;
            border-radius: 999px;
            outline: none;
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                        color 0.22s ease,
                        filter 0.22s ease;
        }

        .dock-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            transform: translateX(-50%) scale(0);
            opacity: 0;
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease;
        }

        .dock-link:hover,
        .dock-link:focus-visible {
            color: var(--accent);
            transform: translateY(-5px) scale(1.14);
            filter: drop-shadow(0 0 14px var(--accent));
        }

        .dock-link:hover::after,
        .dock-link:focus-visible::after {
            transform: translateX(-50%) scale(1);
            opacity: 0.9;
        }

        .dock-link:focus-visible {
            outline: 1.5px solid rgba(255, 255, 255, 0.35);
            outline-offset: 4px;
        }

        .dock-ico {
            width: 84%;
            height: 84%;
            display: block;
            overflow: visible;
        }

        #dockItems {
            display: contents;
        }

        .dock-ico-auto {
            width: 84%;
            height: 84%;
            object-fit: contain;
            opacity: 0.9;
            transition: opacity 0.22s ease, filter 0.22s ease;
        }

        .dock-link:hover .dock-ico-auto,
        .dock-link:focus-visible .dock-ico-auto {
            opacity: 1;
        }

        .dock-link-laforge {
            width: clamp(42px, 6.2vw, 62px);
        }

        .dock-ico-wide {
            width: 96%;
            height: 92%;
            object-fit: contain;
            opacity: 0.9;
            transition: opacity 0.22s ease, filter 0.22s ease;
        }

        .dock-link-laforge:hover .dock-ico-wide,
        .dock-link-laforge:focus-visible .dock-ico-wide {
            opacity: 1;
            filter: brightness(0.92) sepia(1) hue-rotate(4deg) saturate(3.2);
        }

        .dock-sep {
            width: 1px;
            height: clamp(20px, 3vh, 28px);
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0.2),
                rgba(255, 255, 255, 0)
            );
            margin: 0 -2px;
            flex-shrink: 0;
        }

        .dock-link-profile {
            width: clamp(30px, 4.2vw, 40px);
            height: clamp(30px, 4.2vw, 40px);
            color: rgba(255, 255, 255, 0.46);
        }

        @media (max-width: 560px) {
            .dock-caption .cap-desc,
            .dock-caption .cap-sep {
                display: none;
            }
            .dock {
                gap: 8px;
                padding: 8px 13px;
            }
            .dock-link {
                width: 33px;
                height: 33px;
            }
            .dock-link-laforge {
                width: 40px;
            }
            .dock-link-profile {
                width: 28px;
                height: 28px;
            }
        }
    </style>

            const FALLBACK_SIGILS = ['◈', '⬡', '▲', '✦', '⊞', '⊘', '✳', '◉'];

            function hashString(str) {
                let h = 2166136261;
                for (let i = 0; i < str.length; i++) {
                    h ^= str.charCodeAt(i);
                    h = Math.imul(h, 16777619);
                }
                return h >>> 0;
            }

            function buildProceduralGlyphSvg(name) {
                const h = hashString(name.toLowerCase());
                const variant = h % 4;
                if (variant === 0) {
                    return `<svg class="dock-ico" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.3" aria-hidden="true">
                        <polygon points="24,5 41,14.5 41,33.5 24,43 7,33.5 7,14.5" stroke-linejoin="round"/>
                        <polygon points="24,14 33,24 24,34 15,24" stroke-linejoin="round"/>
                    </svg>`;
                } else if (variant === 1) {
                    return `<svg class="dock-ico" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.3" aria-hidden="true">
                        <circle cx="24" cy="24" r="18"/>
                        <polygon points="24,10 36,31 12,31" stroke-linejoin="round"/>
                        <circle cx="24" cy="25" r="2.5" fill="currentColor"/>
                    </svg>`;
                } else if (variant === 2) {
                    return `<svg class="dock-ico" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.3" aria-hidden="true">
                        <rect x="8" y="8" width="32" height="32" rx="7" transform="rotate(45 24 24)"/>
                        <circle cx="24" cy="24" r="6"/>
                    </svg>`;
                }
                return `<svg class="dock-ico" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.3" aria-hidden="true">
                    <path d="M24 5L42 24L24 43L6 24Z" stroke-linejoin="round"/>
                    <path d="M15 24H33M24 15V33" stroke-linecap="round"/>
                </svg>`;
            }

            function summarizeDescription(rawDesc, fallbackName) {
                if (!rawDesc || typeof rawDesc !== 'string') return fallbackName.toLowerCase();
                let cleaned = rawDesc.trim().replace(/\.+$/, '').replace(/\s+/g, ' ').toLowerCase();
                if (cleaned.length <= 40) return cleaned;
                const cut = cleaned.slice(0, 39);
                const lastSpace = cut.lastIndexOf(' ');
                return (lastSpace > 18 ? cut.slice(0, lastSpace) : cut) + '…';
            }

            function normalizePinnedItem(rawItem, repoMetaMap) {
                const rawName = (typeof rawItem === 'string' ? rawItem : rawItem.name) || '';
                const key = rawName.toLowerCase();
                const preset = REPO_REGISTRY[key];
                const meta = (repoMetaMap && repoMetaMap.get(key)) || {};

                const owner = (rawItem && rawItem.author) || (meta.owner && meta.owner.login) || GH_USER;
                const canonicalName = meta.name || rawName;
                const hasPages = Boolean(meta.has_pages || (rawItem && rawItem.hasPages));
                const liveHomepage = (meta.homepage && meta.homepage.trim())
                    || (rawItem && rawItem.homepage && rawItem.homepage.trim())
                    || (hasPages ? `https://${owner}.github.io/${canonicalName}/` : '');
                const repoUrl = meta.html_url || (rawItem && rawItem.repoUrl) || `https://github.com/${owner}/${canonicalName}`;

                const href = (preset && preset.href) || liveHomepage || repoUrl;
                const tag = (preset && preset.tag) || (liveHomepage ? 'LIVE' : 'APP');
                const title = (preset && preset.title) || canonicalName;
                const rawDesc = meta.description || (rawItem && rawItem.description) || '';
                const desc = (preset && preset.desc) || summarizeDescription(rawDesc, canonicalName);

                const h = hashString(key);
                const accent = (preset && preset.accent) || FALLBACK_ACCENTS[h % FALLBACK_ACCENTS.length];
                const sigil = (preset && preset.sigil) || FALLBACK_SIGILS[h % FALLBACK_SIGILS.length];
                const aria = (preset && preset.aria) || (rawDesc ? `${title} — ${rawDesc}` : title);
                const extraClass = (preset && preset.extraClass) || '';

                let discoveredIconUrl = null;
                if (!preset) {
                    try { discoveredIconUrl = localStorage.getItem(ICON_DISCOVERY_PREFIX + key); } catch {}
                }

                const iconHtml = (preset && preset.iconHtml)
                    || (discoveredIconUrl && discoveredIconUrl !== 'none'
                        ? `<img class="dock-ico dock-ico-auto" src="${discoveredIconUrl}" alt="" aria-hidden="true" draggable="false" />`
                        : buildProceduralGlyphSvg(canonicalName));

                return {
                    key,
                    owner,
                    repoName: canonicalName,
                    isCustomUnknown: !preset,
                    title,
                    aria,
                    href,
                    accent,
                    sigil,
                    desc,
                    tag,
                    extraClass,
                    iconHtml
                };
            }

            function showCaption(el) {
                if (!el) return;
                const accent = el.style.getPropertyValue('--accent') || '#ffffff';
                caption.style.setProperty('--cap-accent', accent.trim());
                capSigil.textContent = el.dataset.sigil || '▲';
                capTitle.textContent = el.dataset.title || '';
                capDesc.textContent = el.dataset.desc || '';
                capTag.textContent = el.dataset.tag || '';
                caption.classList.add('is-visible');
            }

            function hideCaption() {
                caption.classList.remove('is-visible');
            }

            // Delegated hover & keyboard focus listeners for dynamic + static dock items
            dock.addEventListener('mouseover', (e) => {
                const link = e.target.closest('.dock-link');
                if (link && dock.contains(link)) {
                    activeHoverLink = link;
                    showCaption(link);
                }
            });

            dock.addEventListener('mouseout', (e) => {
                const link = e.target.closest('.dock-link');
                if (link && (!e.relatedTarget || !link.contains(e.relatedTarget))) {
                    if (activeHoverLink === link) activeHoverLink = null;
                    hideCaption();
                }
            });

            dock.addEventListener('focusin', (e) => {
                const link = e.target.closest('.dock-link');
                if (link && dock.contains(link)) {
                    activeHoverLink = link;
                    showCaption(link);
                }
            });

            dock.addEventListener('focusout', (e) => {
                const link = e.target.closest('.dock-link');
                if (link && (!e.relatedTarget || !link.contains(e.relatedTarget))) {
                    if (activeHoverLink === link) activeHoverLink = null;
                    hideCaption();
                }
            });

            function renderDockItems(items) {
                const nextFingerprint = JSON.stringify(items.map((it) => [it.key, it.href, it.title, it.desc, it.tag, it.accent, it.iconHtml]));
                if (nextFingerprint === currentFingerprint) return;
                currentFingerprint = nextFingerprint;

                const hoveredKey = activeHoverLink && activeHoverLink.dataset ? activeHoverLink.dataset.repoKey : null;
                const frag = document.createDocumentFragment();

                for (const item of items) {
                    const a = document.createElement('a');
                    a.className = item.extraClass ? `dock-link ${item.extraClass}` : 'dock-link';
                    a.href = item.href;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.setAttribute('aria-label', item.aria);
                    a.style.setProperty('--accent', item.accent);
                    a.dataset.repoKey = item.key;
                    a.dataset.sigil = item.sigil;
                    a.dataset.title = item.title;
                    a.dataset.desc = item.desc;
                    a.dataset.tag = item.tag;
                    a.innerHTML = item.iconHtml;
                    frag.appendChild(a);
                }

                dockItemsEl.replaceChildren(frag);

                if (hoveredKey) {
                    const replacement = dockItemsEl.querySelector(`[data-repo-key="${CSS.escape(hoveredKey)}"]`);
                    if (replacement) {
                        activeHoverLink = replacement;
                        showCaption(replacement);
                    }
                }
            }

            async function fetchWithTimeout(url, timeoutMs = 4500, options = {}) {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), timeoutMs);
                try {
                    return await fetch(url, { ...options, signal: ctrl.signal });
                } finally {
                    clearTimeout(timer);
                }
            }

            function parsePinnedFromProfileHtml(html) {
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const cards = doc.querySelectorAll('.pinned-item-list-item, .js-pinned-item-list-item');
                const items = [];
                cards.forEach((card) => {
                    const repoSpan = card.querySelector('.repo');
                    const name = repoSpan ? repoSpan.textContent.trim() : '';
                    if (!name) return;
                    const ownerSpan = card.querySelector('.owner');
                    const author = ownerSpan ? ownerSpan.textContent.trim().replace(/\/$/, '') : GH_USER;
                    const descEl = card.querySelector('.pinned-item-desc');
                    const description = descEl ? descEl.textContent.trim() : '';
                    items.push({ author, name, description });
                });
                return items;
            }

            async function fetchLivePinnedList() {
                // 1. Primary real-time CORS JSON endpoint reflecting live github.com/blainekyle pins
                try {
                    const res = await fetchWithTimeout(`https://pinned.berrysauce.dev/get/${GH_USER}`, 4500);
                    if (res.ok) {
                        const data = await res.json();
                        if (Array.isArray(data) && data.length > 0) return data;
                    }
                } catch {}

                // 2. Secondary real-time HTML scrape of github.com/blainekyle via CORS relays
                const htmlProxies = [
                    `https://corsproxy.io/?url=${encodeURIComponent(`https://github.com/${GH_USER}`)}`,
                    `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://github.com/${GH_USER}`)}`
                ];
                for (const proxyUrl of htmlProxies) {
                    try {
                        const res = await fetchWithTimeout(proxyUrl, 5000);
                        if (res.ok) {
                            const html = await res.text();
                            const parsed = parsePinnedFromProfileHtml(html);
                            if (parsed.length > 0) return parsed;
                        }
                    } catch {}
                }

                // 3. Tertiary self-hosted snapshot (auto-synced by GitHub Actions in this repo)
                try {
                    const res = await fetchWithTimeout('assets/pinned.json', 3000, { cache: 'no-cache' });
                    if (res.ok) {
                        const snap = await res.json();
                        if (snap && Array.isArray(snap.pinned) && snap.pinned.length > 0) return snap.pinned;
                    }
                } catch {}

                return null;
            }

            async function fetchGitHubRepoMap() {
                try {
                    const cached = sessionStorage.getItem(REPO_META_SESSION_KEY);
                    if (cached) {
                        const parsed = JSON.parse(cached);
                        if (parsed && Date.now() - parsed.ts < 5 * 60 * 1000 && Array.isArray(parsed.repos)) {
                            return new Map(parsed.repos.map((r) => [r.name.toLowerCase(), r]));
                        }
                    }
                } catch {}

                try {
                    const res = await fetchWithTimeout(`https://api.github.com/users/${GH_USER}/repos?per_page=100`, 4500, {
                        headers: { 'Accept': 'application/vnd.github+json' }
                    });
                    if (res.ok) {
                        const repos = await res.json();
                        if (Array.isArray(repos)) {
                            try {
                                sessionStorage.setItem(REPO_META_SESSION_KEY, JSON.stringify({ ts: Date.now(), repos }));
                            } catch {}
                            return new Map(repos.map((r) => [r.name.toLowerCase(), r]));
                        }
                    }
                } catch {}
                return new Map();
            }

            // Optional zero-config icon auto-discovery for brand-new future pinned repositories
            async function discoverUnknownRepoIcons(items) {
                const unknowns = items.filter((it) => it.isCustomUnknown);
                if (unknowns.length === 0) return;

                let updated = false;
                for (const it of unknowns) {
                    let cached = null;
                    try { cached = localStorage.getItem(ICON_DISCOVERY_PREFIX + it.key); } catch {}
                    if (cached) continue;

                    try {
                        const res = await fetchWithTimeout(`https://api.github.com/repos/${it.owner}/${it.repoName}/contents`, 4000, {
                            headers: { 'Accept': 'application/vnd.github+json' }
                        });
                        if (!res.ok) continue;
                        const files = await res.json();
                        if (!Array.isArray(files)) continue;

                        const iconCandidate = files.find((f) => f.type === 'file' && /(glyph|logo|icon|ico).*\.(svg|png)$/i.test(f.name))
                            || files.find((f) => f.type === 'file' && /\.svg$/i.test(f.name));

                        const foundUrl = iconCandidate && iconCandidate.download_url ? iconCandidate.download_url : 'none';
                        try { localStorage.setItem(ICON_DISCOVERY_PREFIX + it.key, foundUrl); } catch {}

                        if (foundUrl !== 'none') {
                            it.iconHtml = `<img class="dock-ico dock-ico-auto" src="${foundUrl}" alt="" aria-hidden="true" draggable="false" />`;
                            updated = true;
                        }
                    } catch {}
                }
                if (updated) renderDockItems(items);
            }

            // Step 1: Instant zero-flash initial render from localStorage cache or baseline defaults
            let initialRaw = null;
            try {
                const cachedRaw = localStorage.getItem(CACHE_KEY);
                if (cachedRaw) {
                    const parsed = JSON.parse(cachedRaw);
                    if (Array.isArray(parsed) && parsed.length > 0) initialRaw = parsed;
                }
            } catch {}

            const seedItems = (initialRaw || DEFAULT_FALLBACK_NAMES).map((r) => normalizePinnedItem(r, null));
            renderDockItems(seedItems);

            // Step 2: Live parallel fetch of current GitHub profile pins + official repo metadata
            Promise.all([fetchLivePinnedList(), fetchGitHubRepoMap()]).then(([livePinned, repoMap]) => {
                const sourceList = (livePinned && livePinned.length > 0) ? livePinned : (initialRaw || DEFAULT_FALLBACK_NAMES);
                const normalized = sourceList.map((r) => normalizePinnedItem(r, repoMap));
                renderDockItems(normalized);

                if (livePinned && livePinned.length > 0) {
                    try {
                        localStorage.setItem(CACHE_KEY, JSON.stringify(livePinned));
                    } catch {}
                }

                discoverUnknownRepoIcons(normalized);
            });
        })();
        // --- Canvas Setup (High-DPI aware) ---
        const canvas = document.getElementById('wallpaperCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width = window.innerWidth;
        let height = window.innerHeight;
        let dpr = Math.min(window.devicePixelRatio || 1, 2);

        function syncCanvasMetrics() {
            width = window.innerWidth;
            height = window.innerHeight;
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        syncCanvasMetrics();

        // --- Configuration ---
        const PARTICLE_COUNT_MOUSE = 4;
        const PARTICLE_LIFESPAN_MOUSE = 216;
        const PARTICLE_SPEED_MOUSE_MULTIPLIER = 0.22;
        const PARTICLE_LIFESPAN_IDLE_RANDOM = 200;
        const PARTICLE_BASE_SIZE = 4;
        const MOUSE_INACTIVITY_TIMEOUT = 4000; // ms
        const IDLE_DROPLET_SPAWN_INTERVAL = 70; // ms

        const SHAPE_FORMATION_DELAY = 4000; // ms after idle starts
        const NUM_SHAPES_TO_FORM = 10;
        const PARTICLES_PER_SHAPE_TARGET = 40;
        const SHAPE_LIFESPAN_MULTIPLIER = 4.0;
        const SPARKLE_CHANCE_SHAPE = 0.32;

        const SHAPE_SCALE = 1.5;
        const SHAPE_SLOW_SPIN_DURATION = 300; // frames
        const SHAPE_FAST_SPIN_DURATION = 180; // frames
        const SHAPE_SPIN_SPEED_SLOW = 0.005; // rad/frame
        const SHAPE_SPIN_SPEED_FAST = 0.025; // rad/frame
        const SHAPE_DISINTEGRATE_SPEED = 1.5;

        const MAX_ACTIVE_PARTICLES = 1400;

        // --- Global State ---
        let particles = [];
        let activeShapes = [];
        let hue = 0;
        let mouseX = width / 2;
        let mouseY = height / 2;
        let hasPrevPointer = false;
        let prevMouseX = mouseX;
        let prevMouseY = mouseY;
        let lastMouseMoveTime = Date.now();
        let isIdleMode = false;
        let idleDropletTimer = null;
        let shapeFormationTimeoutId = null;

        // --- Basic Shape Definitions (centered at 0,0) ---
        const basicShapeTemplates = [
            {
                name: 'triangle',
                points: [{x: 0, y: -15}, {x: 13, y: 7.5}, {x: -13, y: 7.5}]
            },
            {
                name: 'square',
                points: [{x: -10, y: -10}, {x: 10, y: -10}, {x: 10, y: 10}, {x: -10, y: 10}]
            },
            {
                name: 'circle',
                points: [
                    {x: 0, y: -12}, {x: 8.5, y: -8.5}, {x: 12, y: 0}, {x: 8.5, y: 8.5},
                    {x: 0, y: 12}, {x: -8.5, y: 8.5}, {x: -12, y: 0}, {x: -8.5, y: -8.5}
                ]
            },
            {
                name: 'cross',
                points: [
                    {x: -3, y: -10}, {x: 3, y: -10}, {x: 3, y: -3}, {x: 10, y: -3},
                    {x: 10, y: 3}, {x: 3, y: 3}, {x: 3, y: 10}, {x: -3, y: 10},
                    {x: -3, y: 3}, {x: -10, y: 3}, {x: -10, y: -3}, {x: -3, y: -3}
                ]
            },
            {
                name: 'star',
                points: [
                    {x: 0, y: -15}, {x: 4.4, y: -4.6}, {x: 14.3, y: -4.6}, {x: 7, y: 2.3},
                    {x: 8.8, y: 12.1}, {x: 0, y: 7.5}, {x: -8.8, y: 12.1}, {x: -7, y: 2.3},
                    {x: -14.3, y: -4.6}, {x: -4.4, y: -4.6}
                ]
            }
        ];

        // --- Particle Class ---
        class Particle {
            constructor(x, y, color, size, type = 'mouse') {
                this.x = x;
                this.y = y;
                this.size = Math.random() * size + PARTICLE_BASE_SIZE / 2;
                this.initialSize = this.size;
                this.color = {...color};
                this.type = type; // 'mouse', 'idle_random', 'shape_forming', 'shape_active'
                this.opacity = 1;
                this.isSparkle = false;
                this.sparkleSeed = Math.random() * 100;
                this.shapeTargetX = 0;
                this.shapeTargetY = 0;
                this.isAtShapeTarget = false;
                this.formationSpeed = Math.random() * 0.04 + 0.02;
                this.shapePointRelX = 0;
                this.shapePointRelY = 0;
                this.parentShape = null;

                if (this.type === 'mouse') {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = (Math.random() * 2.5 + 0.5) * PARTICLE_SPEED_MOUSE_MULTIPLIER;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.life = PARTICLE_LIFESPAN_MOUSE + Math.random() * 40;
                } else if (this.type === 'idle_random') {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 1.5 + 0.3;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.life = PARTICLE_LIFESPAN_IDLE_RANDOM + Math.random() * 40;
                } else if (this.type === 'shape_forming' || this.type === 'shape_active') {
                    this.vx = 0;
                    this.vy = 0;
                    this.life = PARTICLE_LIFESPAN_IDLE_RANDOM * SHAPE_LIFESPAN_MULTIPLIER;
                    this.isSparkle = Math.random() < SPARKLE_CHANCE_SHAPE;
                    if (this.isSparkle) this.color.l = Math.min(100, this.color.l + 25);
                } else {
                    this.vx = 0;
                    this.vy = 0;
                    this.life = PARTICLE_LIFESPAN_IDLE_RANDOM;
                }
                this.initialLife = this.life;
            }

            update(now) {
                this.life--;
                const lifeRatio = Math.max(0, this.life / this.initialLife);
                this.opacity = lifeRatio;
                const currentBaseSize = this.initialSize * lifeRatio;

                if (this.type === 'mouse' || this.type === 'idle_random') {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.97;
                    this.vy *= 0.97;
                    this.size = currentBaseSize;
                } else if (this.type === 'shape_forming') {
                    if (!this.isAtShapeTarget) {
                        const dx = this.shapeTargetX - this.x;
                        const dy = this.shapeTargetY - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist > 1) {
                            this.x += (dx / dist) * Math.min(dist, dist * this.formationSpeed);
                            this.y += (dy / dist) * Math.min(dist, dist * this.formationSpeed);
                        } else {
                            this.isAtShapeTarget = true;
                            this.x = this.shapeTargetX;
                            this.y = this.shapeTargetY;
                            if (this.parentShape) this.parentShape.checkIfFormed();
                        }
                    }
                } else if (this.type === 'shape_active') {
                    if (this.parentShape && this.parentShape.state === 'disintegrating') {
                        this.x += this.vx;
                        this.y += this.vy;
                        this.vx *= 0.98;
                        this.vy *= 0.98;
                    }
                }

                if (this.isSparkle && (this.type === 'shape_forming' || this.type === 'shape_active')) {
                    this.opacity = lifeRatio * (0.7 + Math.sin(now * 0.025 + this.sparkleSeed) * 0.3);
                    this.size = currentBaseSize * (1 + Math.sin(now * 0.035 + this.sparkleSeed + 50) * 0.25);
                } else {
                    this.size = currentBaseSize;
                }
            }

            draw() {
                if (this.size <= 0.1 || this.opacity <= 0) return;
                const r = Math.max(0.1, this.size);
                const { h, s, l } = this.color;

                // Subtle bioluminescent halo
                if (r > 0.8 && this.opacity > 0.08) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, r * 2.35, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${h}, ${s}%, ${l}%, ${(this.opacity * 0.14).toFixed(3)})`;
                    ctx.fill();
                }

                // Crisp core droplet
                ctx.beginPath();
                ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${h}, ${s}%, ${l}%, ${this.opacity.toFixed(3)})`;
                ctx.fill();
            }
        }

        // --- Shape Object Class ---
        class ShapeObject {
            constructor(x, y, shapeTemplate, initialHue) {
                this.anchorX = x;
                this.anchorY = y;
                this.template = shapeTemplate;
                this.particles = [];
                this.state = 'forming'; // 'forming', 'spinning_slow', 'spinning_fast', 'disintegrating', 'done'
                this.currentAngle = Math.random() * Math.PI * 2;
                this.spinSpeed = 0;
                this.age = 0;
                this.baseHue = initialHue;
            }

            addParticle(particle, targetRelX, targetRelY) {
                particle.parentShape = this;
                particle.type = 'shape_forming';
                particle.shapePointRelX = targetRelX;
                particle.shapePointRelY = targetRelY;

                const cos = Math.cos(this.currentAngle);
                const sin = Math.sin(this.currentAngle);
                const rotatedX = targetRelX * cos - targetRelY * sin;
                const rotatedY = targetRelX * sin + targetRelY * cos;
                particle.shapeTargetX = this.anchorX + rotatedX * SHAPE_SCALE;
                particle.shapeTargetY = this.anchorY + rotatedY * SHAPE_SCALE;

                particle.isAtShapeTarget = false;
                particle.life = PARTICLE_LIFESPAN_IDLE_RANDOM * SHAPE_LIFESPAN_MULTIPLIER;
                particle.initialLife = particle.life;
                this.particles.push(particle);
            }

            checkIfFormed() {
                if (this.state !== 'forming') return;
                if (this.particles.length < PARTICLES_PER_SHAPE_TARGET * 0.7) return;

                for (const p of this.particles) {
                    if (!p.isAtShapeTarget) return;
                }
                this.state = 'spinning_slow';
                this.spinSpeed = SHAPE_SPIN_SPEED_SLOW;
                this.particles.forEach((p) => { p.type = 'shape_active'; });
            }

            update() {
                if (this.state === 'done') return;
                this.age++;

                if (this.state === 'spinning_slow') {
                    this.currentAngle += this.spinSpeed;
                    if (this.age > SHAPE_SLOW_SPIN_DURATION) {
                        this.state = 'spinning_fast';
                        this.spinSpeed = SHAPE_SPIN_SPEED_FAST;
                        this.age = 0;
                    }
                } else if (this.state === 'spinning_fast') {
                    this.currentAngle += this.spinSpeed;
                    if (this.age > SHAPE_FAST_SPIN_DURATION) {
                        this.state = 'disintegrating';
                        this.disintegrate();
                    }
                } else if (this.state === 'disintegrating') {
                    let allFaded = true;
                    for (const p of this.particles) {
                        if (p.life > 0) {
                            allFaded = false;
                            break;
                        }
                    }
                    if (allFaded) this.state = 'done';
                }

                if (this.state === 'spinning_slow' || this.state === 'spinning_fast') {
                    const cos = Math.cos(this.currentAngle);
                    const sin = Math.sin(this.currentAngle);
                    for (const p of this.particles) {
                        const rotatedX = p.shapePointRelX * cos - p.shapePointRelY * sin;
                        const rotatedY = p.shapePointRelX * sin + p.shapePointRelY * cos;
                        p.x = this.anchorX + rotatedX * SHAPE_SCALE;
                        p.y = this.anchorY + rotatedY * SHAPE_SCALE;
                    }
                }
            }

            disintegrate() {
                for (const p of this.particles) {
                    p.life = Math.min(p.life, PARTICLE_LIFESPAN_IDLE_RANDOM / 2);
                    const angle = Math.atan2(p.y - this.anchorY, p.x - this.anchorX) + (Math.random() - 0.5) * 0.5;
                    const speed = SHAPE_DISINTEGRATE_SPEED + Math.random();
                    p.vx = Math.cos(angle) * speed;
                    p.vy = Math.sin(angle) * speed;
                }
            }
        }

        function wakeFromIdle() {
            if (!isIdleMode) return;
            isIdleMode = false;
            clearTimeout(shapeFormationTimeoutId);
            if (idleDropletTimer) clearInterval(idleDropletTimer);

            activeShapes.forEach((shape) => {
                if (shape.state !== 'disintegrating' && shape.state !== 'done') {
                    shape.state = 'disintegrating';
                    shape.disintegrate();
                    shape.particles.forEach((p) => {
                        p.life = Math.min(p.life, PARTICLE_LIFESPAN_IDLE_RANDOM / 3);
                    });
                }
            });
        }

        function spawnMouseDropletsAt(x, y) {
            hue = (hue + 3.5) % 360;
            for (let i = 0; i < PARTICLE_COUNT_MOUSE; i++) {
                particles.push(
                    new Particle(
                        x,
                        y,
                        { h: (hue + i * 10) % 360, s: 100, l: 70 },
                        PARTICLE_BASE_SIZE * 1.2,
                        'mouse'
                    )
                );
            }
            if (particles.length > MAX_ACTIVE_PARTICLES) {
                particles.splice(0, particles.length - MAX_ACTIVE_PARTICLES);
            }
        }

        // --- Event Handlers ---
        function handlePointerMove(clientX, clientY) {
            mouseX = clientX;
            mouseY = clientY;
            lastMouseMoveTime = Date.now();
            wakeFromIdle();

            if (!hasPrevPointer) {
                prevMouseX = mouseX;
                prevMouseY = mouseY;
                hasPrevPointer = true;
                spawnMouseDropletsAt(mouseX, mouseY);
                return;
            }

            const dx = mouseX - prevMouseX;
            const dy = mouseY - prevMouseY;
            const dist = Math.hypot(dx, dy);
            const steps = Math.min(5, Math.max(1, Math.floor(dist / 16)));

            for (let s = 1; s <= steps; s++) {
                const t = s / steps;
                spawnMouseDropletsAt(prevMouseX + dx * t, prevMouseY + dy * t);
            }

            prevMouseX = mouseX;
            prevMouseY = mouseY;
        }

        function handleCanvasBurst(clientX, clientY) {
            lastMouseMoveTime = Date.now();
            wakeFromIdle();
            const burstCount = 18;
            const baseHue = hue;
            for (let i = 0; i < burstCount; i++) {
                const angle = (i / burstCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.15;
                const p = new Particle(
                    clientX,
                    clientY,
                    { h: (baseHue + i * 8) % 360, s: 100, l: 74 },
                    PARTICLE_BASE_SIZE * 1.35,
                    'mouse'
                );
                const speed = 1.4 + Math.random() * 1.3;
                p.vx = Math.cos(angle) * speed;
                p.vy = Math.sin(angle) * speed;
                particles.push(p);
            }
        }

        // --- Idle Mode Logic ---
        function checkIdleStatus() {
            if (Date.now() - lastMouseMoveTime > MOUSE_INACTIVITY_TIMEOUT && !isIdleMode) {
                isIdleMode = true;
                hasPrevPointer = false;
                startIdleDroplets();
                clearTimeout(shapeFormationTimeoutId);
                shapeFormationTimeoutId = setTimeout(startShapesFormation, SHAPE_FORMATION_DELAY);
            }
        }

        function startIdleDroplets() {
            if (idleDropletTimer) clearInterval(idleDropletTimer);
            idleDropletTimer = setInterval(() => {
                if (!isIdleMode || activeShapes.some((s) => s.state !== 'done')) return;
                if (particles.length >= MAX_ACTIVE_PARTICLES) return;

                const x = Math.random() * width;
                const y = Math.random() * height;
                const randomHue = Math.random() * 360;
                particles.push(
                    new Particle(x, y, { h: randomHue, s: 90, l: 60 }, PARTICLE_BASE_SIZE * 0.9, 'idle_random')
                );
            }, IDLE_DROPLET_SPAWN_INTERVAL);
        }

        function startShapesFormation() {
            if (!isIdleMode || activeShapes.some((s) => s.state !== 'done' && s.state !== 'disintegrating')) return;

            activeShapes = [];

            const availableIdleParticles = particles.filter((p) => p.type === 'idle_random');
            availableIdleParticles.sort(() => 0.5 - Math.random());

            let particlePoolIndex = 0;

            for (let i = 0; i < NUM_SHAPES_TO_FORM; i++) {
                const shapeX = Math.random() * (width * 0.8) + (width * 0.1);
                const shapeY = Math.random() * (height * 0.74) + (height * 0.08);
                const template = basicShapeTemplates[Math.floor(Math.random() * basicShapeTemplates.length)];
                const shapeHue = (hue + i * (360 / NUM_SHAPES_TO_FORM)) % 360;

                const newShape = new ShapeObject(shapeX, shapeY, template, shapeHue);

                for (let j = 0; j < PARTICLES_PER_SHAPE_TARGET; j++) {
                    const shapePointDef = template.points[j % template.points.length];
                    let p;

                    if (particlePoolIndex < availableIdleParticles.length) {
                        p = availableIdleParticles[particlePoolIndex++];
                    } else {
                        const spawnX = shapeX + (Math.random() - 0.5) * 50;
                        const spawnY = shapeY + (Math.random() - 0.5) * 50;
                        p = new Particle(
                            spawnX,
                            spawnY,
                            { h: (shapeHue + j * 5) % 360, s: 100, l: 70 },
                            PARTICLE_BASE_SIZE,
                            'shape_forming'
                        );
                        particles.push(p);
                    }

                    p.color.h = (shapeHue + j * (360 / PARTICLES_PER_SHAPE_TARGET / 2)) % 360;
                    p.color.s = 100;
                    p.color.l = 75;
                    newShape.addParticle(p, shapePointDef.x, shapePointDef.y);
                }
                activeShapes.push(newShape);
            }
        }

        function updateActiveShapes() {
            for (let i = activeShapes.length - 1; i >= 0; i--) {
                const shape = activeShapes[i];
                shape.update();
                if (shape.state === 'done') {
                    activeShapes.splice(i, 1);
                }
            }
            if (isIdleMode && activeShapes.length === 0 && (Date.now() - lastMouseMoveTime > MOUSE_INACTIVITY_TIMEOUT)) {
                clearTimeout(shapeFormationTimeoutId);
                shapeFormationTimeoutId = setTimeout(startShapesFormation, SHAPE_FORMATION_DELAY / 2);
            }
        }

        // --- Animation Loop ---
        function animate() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            const now = Date.now();
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update(now);
                p.draw();
                if (p.life <= 0 || p.size <= 0.05 || p.opacity <= 0.01) {
                    particles.splice(i, 1);
                }
            }

            checkIdleStatus();
            if (isIdleMode || activeShapes.length > 0) {
                updateActiveShapes();
            }

            hue = (hue + 0.2) % 360;
            requestAnimationFrame(animate);
        }

        // --- Initialization ---
        window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
        window.addEventListener('mouseleave', () => { hasPrevPointer = false; });

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) handleCanvasBurst(e.clientX, e.clientY);
        });

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                hasPrevPointer = false;
                handleCanvasBurst(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        window.addEventListener('resize', syncCanvasMetrics);

        animate();
    </script>
</body>
</html>
